name: baby_track_flutter
description: BabyTrack Monitor - Real-time baby health monitoring application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (updated for web compatibility)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3

  # Crash Reporting
  firebase_crashlytics: ^4.0.0

  # Push Notifications
  firebase_messaging: ^15.1.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.1

  # Local Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Biometrics
  local_auth: ^2.1.8

  # Bluetooth Low Energy
  flutter_blue_plus: ^1.31.13

  # WiFi
  wifi_iot: ^0.3.19+1

  # Video/Audio
  flutter_webrtc: ^1.4.1
  audioplayers: ^5.2.1

  # Charts
  fl_chart: ^0.66.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Haptics
  vibration: ^3.1.8

  # Utilities
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  permission_handler: ^12.0.3
  record: ^5.1.2
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0

  # HTTP
  http: ^1.2.0

  # WebSockets for live audio
  web_socket_channel: ^2.4.0

  # MQTT for IoT device communication
  mqtt_client: ^10.2.0

  # Path utilities
  path: ^1.8.3
  flutter_sound: ^9.30.0
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  
  # Testing utilities

dependency_overrides:
  record_linux: ^1.3.1
  mocktail: ^1.0.3
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true

