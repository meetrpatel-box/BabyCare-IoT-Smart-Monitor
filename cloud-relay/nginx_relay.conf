##
## BabyTrack relay – nginx site config
## Place at /etc/nginx/sites-available/relay and symlink to sites-enabled/
##

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name relay.nxmplis.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name relay.nxmplis.com;

    ssl_certificate     /etc/letsencrypt/live/relay.nxmplis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.nxmplis.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── ESP32 WebSocket ingest → Python sidecar (port 8765) ──────────────
    location /ingest/ {
        proxy_pass          http://127.0.0.1:8765;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;   # keep alive for long-running streams
        proxy_send_timeout  3600s;
    }

    # ── PTT speak relay → Python sidecar HTTP server (port 8766) ─────────
    location /speak/ {
        proxy_pass          http://127.0.0.1:8766;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }

    # ── Flutter WebRTC / go2rtc REST API → go2rtc (port 1984) ────────────
    location /api/ {
        proxy_pass          http://127.0.0.1:1984;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
    }

    # ── go2rtc web UI (optional) ──────────────────────────────────────────
    location / {
        proxy_pass          http://127.0.0.1:1984;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
    }
}
