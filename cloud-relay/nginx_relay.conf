# nginx site config for relay.nxmplis.com
#
# nginx is the only public entry point. babytrack-relay binds its WebSocket and
# media listeners to 127.0.0.1, and go2rtc's API binds to 127.0.0.1 as well, so
# every route below is the sole path to what it proxies.
#
# Auth model: one shared token, passed as ?token=... on every public route.
#   /ingest/  validated by the relay (device ingest)
#   /speak/   validated by the relay (push-to-talk)
#   /audio/   validated by the relay (microphone stream)
#   /api/     validated HERE — go2rtc has no auth of its own
#
# /api/ is the WebRTC signalling route, and go2rtc will happily hand a live
# stream to anyone who posts a valid SDP offer naming a device. Before this
# check, knowing a device id was enough to watch the camera. The Flutter app
# already sent the token on this route; it simply was never inspected.

server {
    server_name relay.nxmplis.com;

    # Device ingest — WebSocket, token checked by the relay.
    location /ingest/ {
        proxy_pass http://127.0.0.1:8765/ingest/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Push-to-talk — token checked by the relay.
    location /speak/ {
        proxy_pass http://127.0.0.1:8766/speak/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Microphone stream — token checked by the relay.
    location /audio/ {
        proxy_pass http://127.0.0.1:8766/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebRTC signalling to go2rtc. go2rtc performs no authentication, so the
    # token is enforced here instead. A bare `return` inside `if` is one of the
    # few forms that is safe in a location context.
    location /api/ {
        if ($arg_token != "2af0a9e90c97421aa37972c3c5e28151157dc5360000a1f9fe7efd9875dd96c8") {
            return 403;
        }
        proxy_pass http://127.0.0.1:1984/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/relay.nxmplis.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/relay.nxmplis.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = relay.nxmplis.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name relay.nxmplis.com;
    return 404; # managed by Certbot
}
